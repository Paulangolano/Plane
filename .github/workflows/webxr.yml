# Tests the WebXR game on every push and pull request, and publishes it to GitHub Pages
# from the main branch (Settings ▸ Pages ▸ Source: "GitHub Actions").
name: WebXR

on:
  push:
    branches: [main]
    paths: ['webxr/**', '.github/workflows/webxr.yml']
  pull_request:
    paths: ['webxr/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webxr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webxr/package-lock.json
      - run: npm ci
      - run: npx playwright@1.56.1 install --with-deps chromium
      - run: npm i --no-save playwright@1.56.1
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webxr/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
