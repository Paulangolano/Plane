# Tests the WebXR game and publishes it to GitHub Pages from the main branch
# (Settings ▸ Pages ▸ Source: "GitHub Actions").
#  - build:   unit tests (flight physics, world, full-course autopilot) + production build → Pages
#  - browser: Playwright tests incl. an emulated Quest 2 (runs in parallel, doesn't block publishing)
name: WebXR

on:
  push:
    branches: [main]
    paths: ['webxr/**', '.github/workflows/webxr.yml']
  pull_request:
    paths: ['webxr/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: webxr

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webxr/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: webxr/dist

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webxr/package-lock.json
      - run: npm ci
      - run: npm i --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log || {
            # Surface each failing test (and its error) as an annotation on the run.
            grep -E "^not ok|^ +error:|^ +(expected|actual):|Error:" e2e.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
